name: 无设备检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: 源码
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q -x '/\._' 核心 脚本
  application:
    name: 应用 / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 应用
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装开发依赖
        run: python -m pip install 'setuptools>=77' wheel '.[usb,test]'
      - name: 合成测试及原生 ELF 仿真，不访问相机
        run: python scripts/check.py --native --strict
      - name: 构建 wheel
        run: python scripts/build_wheel.py --offline
      - name: 构建独立源码包
        run: python scripts/build_source.py
      - name: 编译桌面演示（仅 macOS）
        if: runner.os == 'macOS'
        run: python scripts/build_macos_preview.py
