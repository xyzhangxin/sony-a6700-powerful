name: 无设备检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: 源码
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q -x '/\._' 核心 脚本
  application:
    name: 应用 / ${{ matrix.os }} / Python ${{ matrix.python }}
    env:
      # 仓库路径含中文；Windows 控制台默认 ANSI 代码页无法输出。
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: 应用
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装原生测试编译器（Linux）
        if: runner.os == 'Linux'
        run: |
          # 优先复用镜像自带的 clang／lld；镜像源不可达时不要让整条检查卡死，
          # 退化为纯 Python 套件并在日志中明确标注。
          set +e
          pick() { for c in "$@"; do if command -v "$c" >/dev/null 2>&1; then command -v "$c"; return 0; fi; done; return 1; }
          CANDIDATES="clang clang-22 clang-21 clang-20 clang-19 clang-18 clang-17 clang-16"
          LLD_CANDIDATES="ld.lld ld.lld-22 ld.lld-21 ld.lld-20 ld.lld-19 ld.lld-18 ld.lld-17 ld.lld-16"
          CLANG=$(pick $CANDIDATES)
          LLD=$(pick $LLD_CANDIDATES)
          if [ -z "$CLANG" ] || [ -z "$LLD" ]; then
            timeout 240 sudo apt-get update
            timeout 240 sudo apt-get install -y clang lld
            CLANG=$(pick $CANDIDATES)
            LLD=$(pick $LLD_CANDIDATES)
          fi
          if [ -n "$CLANG" ] && [ -n "$LLD" ]; then
            sudo ln -sf "$CLANG" /usr/local/bin/clang
            sudo ln -sf "$LLD" /usr/local/bin/ld.lld
            echo "NATIVE_TOOLS=1" >> "$GITHUB_ENV"
            clang --version | head -1
            ld.lld --version | head -1
          else
            echo "NATIVE_TOOLS=0" >> "$GITHUB_ENV"
            echo "::warning::clang/lld unavailable; Linux job runs the pure-Python suite only"
          fi
      - name: 安装原生测试链接器（macOS）
        if: runner.os == 'macOS'
        run: brew install lld
      - name: 配置原生测试编译器（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: 安装开发依赖
        run: python -m pip install 'setuptools>=77' wheel '.[usb,test]'
      - name: 合成测试及原生 ELF 仿真，不访问相机
        if: env.NATIVE_TOOLS != '0'
        run: python scripts/check.py --native --strict
      - name: 合成测试（无原生工具链时退化为纯 Python）
        if: env.NATIVE_TOOLS == '0'
        run: python scripts/check.py
      - name: 构建 wheel
        run: python scripts/build_wheel.py --offline
      - name: 构建独立源码包
        run: python scripts/build_source.py
      - name: 编译桌面演示（仅 macOS）
        if: runner.os == 'macOS'
        run: python scripts/build_macos_preview.py
